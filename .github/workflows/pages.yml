name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Publikujemy tylko pliki strony – bez skryptów, node_modules i oryginałów zdjęć
      - name: Przygotuj katalog _site
        run: |
          mkdir -p _site/assets/img
          cp index.html polityka-prywatnosci.html 404.html CNAME robots.txt sitemap.xml \
             favicon.svg favicon.ico apple-touch-icon.png _site/
          cp -r css js _site/
          cp -r assets/fonts _site/assets/
          find assets/img -maxdepth 1 -type f -exec cp {} _site/assets/img/ \;

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
