<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>OG – Aleksandra Kawka</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { display: grid; grid-template-columns: 690px 510px; width: 1200px; height: 630px; }
  .og__left { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 26px; padding: 0 64px 64px; background: var(--c-hero); color: #fff; }
  .og__eyebrow { display: flex; align-items: center; gap: 16px; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.86); }
  .og__eyebrow span { width: 44px; height: 1px; background: currentColor; }
  .og__title { font-family: var(--f-serif); font-weight: 300; font-size: 128px; line-height: .9; }
  .og__title i { display: block; padding-left: .7em; color: #eee7df; }
  .og__right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 48px; background: var(--c-soft); text-align: center; border-left: 1px solid var(--c-line); }
  .og__mono { display: flex; align-items: center; justify-content: center; width: 112px; height: 112px; border: 1px solid var(--c-brown); border-radius: 50%; color: var(--c-brown); font-family: var(--f-serif); font-style: italic; font-size: 44px; }
  .og__tag { font-family: var(--f-serif); font-style: italic; font-weight: 300; font-size: 38px; line-height: 1.2; color: var(--c-brown); }
  .og__line { width: 120px; height: 1px; background: var(--c-accent); }
  .og__meta { font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: var(--c-muted); line-height: 2; }
</style>
</head>
<body>
<div class="og">
  <div class="og__left">
    <p class="og__eyebrow"><span></span>Makijaż · Fryzury · Szkolenia</p>
    <p class="og__title">Aleksandra<i>Kawka</i></p>
  </div>
  <div class="og__right">
    <span class="og__mono">AK</span>
    <p class="og__tag">Wizaż<br>i stylizacja fryzur</p>
    <span class="og__line"></span>
    <p class="og__meta">aleksandrakawka.pl<br>511 791 745</p>
  </div>
</div>
</body>
</html>
